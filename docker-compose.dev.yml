# 개발 환경용 docker-compose (파이프라인 완전 버전)
services:
  # ============================================
  # Database
  # ============================================
  db:
    build:
      context: .
      dockerfile: infra/docker/db/Dockerfile
    environment:
      POSTGRES_DB: bodam
      POSTGRES_USER: bodam
      POSTGRES_PASSWORD: bodam
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/docker/db/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bodam-network

  # ============================================
  # Redis 3종 (분리)
  # ============================================

  # Cache Redis (DB 0) - LRU 정책
  redis-cache:
    image: redis:7.2-alpine
    container_name: bodam-redis-cache
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save ""
      --loglevel warning
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bodam-network

  # Queue Redis (DB 0, 1) - AOF + RDB 영속성
  redis-queue:
    image: redis:7.2-alpine
    container_name: bodam-redis-queue
    command: >
      redis-server
      --maxmemory 1gb
      --maxmemory-policy noeviction
      --appendonly yes
      --appendfsync everysec
      --save 60 1
      --loglevel warning
    ports:
      - "6380:6379"
    volumes:
      - redis-queue-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bodam-network

  # Semantic Redis (DB 2) - Vector Store
  redis-semantic:
    image: redis/redis-stack-server:latest
    container_name: bodam-redis-semantic
    environment:
      - REDIS_ARGS=--maxmemory 2gb --maxmemory-policy noeviction --save 300 1 --appendonly yes
    ports:
      - "6381:6379"
    volumes:
      - redis-semantic-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bodam-network

  # ============================================
  # Backend Application
  # ============================================
  backend:
    build:
      context: ./backend
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - backend/.env
    environment:
      # Database
      - DATABASE_URL=postgresql+asyncpg://bodam:bodam@db:5432/bodam

      # Redis 3종
      - REDIS_CACHE_URL=redis://redis-cache:6379/0
      - REDIS_QUEUE_URL=redis://redis-queue:6379/0
      - REDIS_SEMANTIC_URL=redis://redis-semantic:6379/2

      # Celery
      - CELERY_BROKER_URL=redis://redis-queue:6379/0
      - CELERY_RESULT_BACKEND=redis://redis-queue:6379/1

      # Security
      - JWT_SECRET=dev-jwt-secret-key-for-bodam-project-must-be-long-enough-for-hmac-algorithm
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_TTL=15
      - REFRESH_TOKEN_TTL=10080
      - PASSWORD_RESET_TOKEN_TTL=30

      # Cookies & CORS
      - COOKIE_DOMAIN=localhost
      - COOKIE_SECURE=false
      - COOKIE_SAMESITE=Lax
      - ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000

      # External APIs (from .env file)
      - NAVER_CLIENT_ID=${NAVER_CLIENT_ID}
      - NAVER_CLIENT_SECRET=${NAVER_CLIENT_SECRET}
      - NAVER_LOGIN_CLIENT_ID=${NAVER_LOGIN_CLIENT_ID}
      - NAVER_LOGIN_CLIENT_SECRET=${NAVER_LOGIN_CLIENT_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY}
      - TOGETHER_AI_API_KEY=${TOGETHER_AI_API_KEY}
      - TOGETHER_AI_MODEL=${TOGETHER_AI_MODEL:-meta-llama/Llama-3.3-70B-Instruct-Turbo}
      - TOSS_CLIENT_KEY=${TOSS_CLIENT_KEY}
      - TOSS_SECRET_KEY=${TOSS_SECRET_KEY}

      # Feature Flags
      - DEBUG=true
      - ENABLE_RATE_LIMITING=false
      - ENABLE_MONITORING=true

    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy
      redis-semantic:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src:rw
      - ./backend/alembic:/app/alembic:rw
      - ./backend/knowledge_docs:/app/knowledge_docs:rw
      - ./backend/firebase-service-account.json:/app/firebase-service-account.json:ro
    networks:
      - bodam-network

  # ============================================
  # Celery Workers
  # ============================================

  # Main Worker (incident processing, dispatch events)
  celery-worker:
    build:
      context: ./backend
    command: celery -A src.worker.celery_app worker --loglevel=info --queues=celery,critical --concurrency=4
    env_file:
      - backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://bodam:bodam@db:5432/bodam
      - REDIS_CACHE_URL=redis://redis-cache:6379/0
      - REDIS_QUEUE_URL=redis://redis-queue:6379/0
      - REDIS_SEMANTIC_URL=redis://redis-semantic:6379/2
      - CELERY_BROKER_URL=redis://redis-queue:6379/0
      - CELERY_RESULT_BACKEND=redis://redis-queue:6379/1
      - NAVER_CLIENT_ID=${NAVER_CLIENT_ID}
      - NAVER_CLIENT_SECRET=${NAVER_CLIENT_SECRET}
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY}
      - TOGETHER_AI_API_KEY=${TOGETHER_AI_API_KEY}
      - TOGETHER_AI_MODEL=${TOGETHER_AI_MODEL:-meta-llama/Llama-3.3-70B-Instruct-Turbo}
    depends_on:
      - db
      - redis-queue
      - redis-cache
      - redis-semantic
    volumes:
      - ./backend/src:/app/src:rw
    networks:
      - bodam-network

  # News Matcher Worker (AI/semantic matching)
  celery-worker-news:
    build:
      context: ./backend
    command: celery -A src.worker.celery_app worker --loglevel=info --queues=news_matching --concurrency=2
    env_file:
      - backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://bodam:bodam@db:5432/bodam
      - REDIS_CACHE_URL=redis://redis-cache:6379/0
      - REDIS_QUEUE_URL=redis://redis-queue:6379/0
      - REDIS_SEMANTIC_URL=redis://redis-semantic:6379/2
      - CELERY_BROKER_URL=redis://redis-queue:6379/0
      - CELERY_RESULT_BACKEND=redis://redis-queue:6379/1
      - NAVER_CLIENT_ID=${NAVER_CLIENT_ID}
      - NAVER_CLIENT_SECRET=${NAVER_CLIENT_SECRET}
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY}
      - TOGETHER_AI_API_KEY=${TOGETHER_AI_API_KEY}
      - TOGETHER_AI_MODEL=${TOGETHER_AI_MODEL:-meta-llama/Llama-3.3-70B-Instruct-Turbo}
    depends_on:
      - db
      - redis-queue
      - redis-semantic
    volumes:
      - ./backend/src:/app/src:rw
    networks:
      - bodam-network

  # Celery Beat (스케줄러)
  celery-beat:
    build:
      context: ./backend
    command: celery -A src.worker.celery_app beat --loglevel=info
    env_file:
      - backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://bodam:bodam@db:5432/bodam
      - REDIS_CACHE_URL=redis://redis-cache:6379/0
      - REDIS_QUEUE_URL=redis://redis-queue:6379/0
      - CELERY_BROKER_URL=redis://redis-queue:6379/0
      - CELERY_RESULT_BACKEND=redis://redis-queue:6379/1
    depends_on:
      - redis-queue
    volumes:
      - ./backend/src:/app/src:rw
    networks:
      - bodam-network

  # Celery Flower (모니터링)

  # ============================================
  # Redis GUI (RedisInsight)
  # ============================================
  redis-insight:
    image: redis/redisinsight:latest
    container_name: bodam-redis-insight
    ports:
      - "5540:5540"
    volumes:
      - redis-insight-data:/data
    networks:
      - bodam-network

  # ============================================
  # Kong Gateway
  # ============================================
  kong:
    image: kong:3.5
    container_name: bodam-kong
    environment:
      - KONG_DATABASE=off
      - KONG_DECLARATIVE_CONFIG=/kong.yaml
      - KONG_PROXY_LISTEN=0.0.0.0:8000
      - KONG_ADMIN_LISTEN=0.0.0.0:8001
      - KONG_LOG_LEVEL=info
      - KONG_NGINX_WORKER_PROCESSES=2
    ports:
      - "8001:8000"  # Kong Proxy (외부 진입점)
      - "8002:8001"  # Kong Admin API
    volumes:
      - ./infra/k8s/kong/kong-configmap.yaml:/tmp/kong-configmap.yaml:ro
      - type: bind
        source: ./kong-local.yaml
        target: /kong.yaml
        read_only: true
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      - backend
    networks:
      - bodam-network

  # ============================================
  # Frontend
  # ============================================
  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
      - API_BASE_URL=http://backend:8000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app:rw
      - /app/node_modules
      - /app/.next
    networks:
      - bodam-network

  # ============================================
  # 관측성 스택 (Prometheus, Grafana, statsd-exporter)
  # ============================================
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: bodam-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./specs/004-hybrid-observability-stack/contracts/prometheus-config.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=3d'
      - '--storage.tsdb.retention.size=10GB'
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - bodam-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.2.3
    container_name: bodam-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - SLACK_BODAM_ALERT_WEBHOOK=${SLACK_BODAM_ALERT_WEBHOOK}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/k8s/observability/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./infra/k8s/observability/grafana-alerting.yml:/etc/grafana/provisioning/alerting/contact-points.yml:ro
      - ./infra/k8s/observability/grafana-alert-rules.yml:/etc/grafana/provisioning/alerting/rules.yml:ro
      - ./infra/grafana/provisioning/dashboards/dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml:ro
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - bodam-network
    restart: unless-stopped

  statsd-exporter:
    image: prom/statsd-exporter:v0.26.0
    container_name: bodam-statsd-exporter
    ports:
      - "9102:9102"  # Prometheus metrics endpoint
      - "8125:8125/udp"  # statsd UDP port
    command:
      - '--statsd.mapping-config=/etc/statsd/statsd-mapping.yml'
    volumes:
      - ./infra/k8s/observability/statsd-mapping.yml:/etc/statsd/statsd-mapping.yml:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9102/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - bodam-network
    restart: unless-stopped

  # ============================================
  # Node Exporter - System metrics
  # ============================================
  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: bodam-node-exporter
    ports:
      - "9100:9100"
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9100/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - bodam-network
    restart: unless-stopped

  # ============================================
  # K6 Load Testing
  # ============================================
  k6:
    image: grafana/k6:latest
    container_name: bodam-k6
    profiles:
      - test  # 'docker-compose --profile test up k6' 로 실행
    environment:
      - K6_SCENARIO=baseline  # baseline, target, stress, spike 중 선택
      - BASE_URL=http://backend:8000
      - TEST_TOKEN=${TEST_TOKEN:-Bearer test-token}
      - DONATION_FIRE_STATION_ID=${DONATION_FIRE_STATION_ID:-9dc63e0c-df47-4f95-af37-cd284cf32822}
      - DONATION_AMOUNT=${DONATION_AMOUNT:-10000}
      - K6_VUS=${K6_VUS:-50}
      - K6_DURATION=${K6_DURATION:-2m}
      - PAYMENT_ORDER_ID=${PAYMENT_ORDER_ID:-}
      - PAYMENT_KEY=${PAYMENT_KEY:-}
      - PAYMENT_AMOUNT=${PAYMENT_AMOUNT:-10000}
      - IDEMPOTENCY_KEY=${IDEMPOTENCY_KEY:-k6-test-fixed-key}
      - K6_TEST_SCRIPT=${K6_TEST_SCRIPT:-k6-scenarios.js}
    volumes:
      - ./specs/004-hybrid-observability-stack/contracts:/scripts:ro
    command: run /scripts/${K6_TEST_SCRIPT}
    depends_on:
      - backend
      - statsd-exporter
    networks:
      - bodam-network

# ============================================
# Networks & Volumes
# ============================================
networks:
  bodam-network:
    driver: bridge

volumes:
  postgres-data:
  redis-queue-data:
  redis-semantic-data:
  redis-insight-data:
  prometheus-data:
  grafana-data:
