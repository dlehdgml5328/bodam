apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring
data:
  alertmanager.yml: |
    global:
      slack_api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK'

    route:
      group_by: ['alertname', 'cluster', 'service']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: 'web.hook'
      routes:
      - match:
          severity: critical
        receiver: 'slack-critical'
      - match:
          severity: warning
        receiver: 'slack-warning'
      - match:
          service: redis
        receiver: 'slack-redis'

    receivers:
    - name: 'web.hook'
      webhook_configs:
      - url: 'http://localhost:5001/'

    - name: 'slack-critical'
      slack_configs:
      - channel: '#alerts-critical'
        username: 'BoDam-AlertManager'
        icon_emoji: ':fire:'
        title: 'Critical Alert - {{ .GroupLabels.alertname }}'
        text: |
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *Severity:* {{ .Labels.severity }}
          *Instance:* {{ .Labels.instance }}
          {{ end }}
        actions:
        - type: button
          text: 'View Dashboard'
          url: '{{ template "slack.default.actionURL" . }}'

    - name: 'slack-warning'
      slack_configs:
      - channel: '#alerts-warning'
        username: 'BoDam-AlertManager'
        icon_emoji: ':warning:'
        title: 'Warning Alert - {{ .GroupLabels.alertname }}'
        text: |
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *Severity:* {{ .Labels.severity }}
          *Instance:* {{ .Labels.instance }}
          {{ end }}

    - name: 'slack-redis'
      slack_configs:
      - channel: '#redis-alerts'
        username: 'BoDam-Redis-Monitor'
        icon_emoji: ':redis:'
        title: 'Redis Alert - {{ .GroupLabels.alertname }}'
        text: |
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *Redis Instance:* {{ .Labels.instance }}
          *Memory Usage:* {{ .Labels.memory_usage_percentage }}%
          {{ end }}

    inhibit_rules:
    - source_match:
        severity: 'critical'
      target_match:
        severity: 'warning'
      equal: ['alertname', 'cluster', 'service']
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: redis-alerts
  namespace: monitoring
  labels:
    app: redis
spec:
  groups:
  - name: redis.rules
    rules:
    - alert: RedisDown
      expr: redis_up == 0
      for: 5m
      labels:
        severity: critical
        service: redis
      annotations:
        summary: "Redis instance is down"
        description: "Redis instance {{ $labels.instance }} has been down for more than 5 minutes."

    - alert: RedisHighMemoryUsage
      expr: redis_memory_used_bytes / redis_memory_max_bytes * 100 > 90
      for: 10m
      labels:
        severity: warning
        service: redis
      annotations:
        summary: "Redis high memory usage"
        description: "Redis instance {{ $labels.instance }} memory usage is above 90% (current value: {{ $value }}%)"

    - alert: RedisHighConnections
      expr: redis_connected_clients > 100
      for: 5m
      labels:
        severity: warning
        service: redis
      annotations:
        summary: "Redis high connection count"
        description: "Redis instance {{ $labels.instance }} has {{ $value }} connections"

    - alert: RedisSlowQueries
      expr: rate(redis_commands_duration_seconds_total[5m]) > 0.1
      for: 5m
      labels:
        severity: warning
        service: redis
      annotations:
        summary: "Redis slow queries detected"
        description: "Redis instance {{ $labels.instance }} is experiencing slow queries"

    - alert: RedisKeyspaceHitRateLow
      expr: rate(redis_keyspace_hits_total[5m]) / (rate(redis_keyspace_hits_total[5m]) + rate(redis_keyspace_misses_total[5m])) < 0.8
      for: 15m
      labels:
        severity: warning
        service: redis
      annotations:
        summary: "Redis keyspace hit rate is low"
        description: "Redis instance {{ $labels.instance }} keyspace hit rate is {{ $value }}% (below 80%)"