# NGINX Ingress Controller Deployment (Replicas = 2, HA)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-ingress
  labels:
    app: nginx-ingress
    tier: ingress
spec:
  replicas: 2  # HA를 위해 최소 2개
  selector:
    matchLabels:
      app: nginx-ingress
  template:
    metadata:
      labels:
        app: nginx-ingress
        tier: ingress
    spec:
      containers:
      - name: nginx
        image: nginx:1.25-alpine
        imagePullPolicy: Always
        
        ports:
        - containerPort: 80
          name: http
        - containerPort: 443
          name: https
        
        # 리소스 제한
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        
        # Health Check
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
        
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
        
        # ConfigMap 마운트
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
          readOnly: true
        
        # TLS 인증서 마운트
        - name: tls-secret
          mountPath: /etc/nginx/ssl
          readOnly: true
        
        # 정적 파일 볼륨
        - name: static-files
          mountPath: /var/www/static
        - name: media-files
          mountPath: /var/www/media
      
      volumes:
      - name: nginx-config
        configMap:
          name: nginx-config
      
      - name: tls-secret
        secret:
          secretName: bodam-tls-secret
      
      - name: static-files
        emptyDir: {}
      
      - name: media-files
        emptyDir: {}

---
# NGINX Ingress Service (LoadBalancer)
apiVersion: v1
kind: Service
metadata:
  name: nginx-ingress-service
  labels:
    app: nginx-ingress
spec:
  selector:
    app: nginx-ingress
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
  - port: 443
    targetPort: 443
    protocol: TCP
    name: https
  type: LoadBalancer  # 외부 트래픽 수신
