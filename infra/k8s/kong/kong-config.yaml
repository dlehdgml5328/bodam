# Kong Gateway Declarative Configuration
# This file defines all API routes, services, and plugins for the BoDam platform

_format_version: "3.0"
_transform: true

# Services: Backend services that Kong Gateway proxies to
services:
  - name: bodam-backend
    url: http://bodam-backend.default.svc.cluster.local:80
    connect_timeout: 60000
    write_timeout: 60000
    read_timeout: 60000

# Routes: URL paths mapped to services
routes:
  # Donation API routes
  - name: donations-list
    service: bodam-backend
    paths:
      - /api/donations
    methods:
      - GET
      - POST
    strip_path: false
    preserve_host: true
    plugins:
      - name: rate-limiting
        config:
          minute: 100
          hour: 1000
          policy: local
      - name: jwt
        config:
          secret_is_base64: false
          claims_to_verify:
            - exp

  - name: donations-detail
    service: bodam-backend
    paths:
      - /api/donations/~
    methods:
      - GET
      - PUT
      - DELETE
    strip_path: false
    preserve_host: true
    plugins:
      - name: rate-limiting
        config:
          minute: 50
          hour: 500
      - name: jwt

  # Fire Station API routes
  - name: fire-stations-search
    service: bodam-backend
    paths:
      - /api/fire-stations/search
    methods:
      - GET
    strip_path: false
    preserve_host: true
    plugins:
      - name: rate-limiting
        config:
          minute: 200
          hour: 2000
          policy: local

  - name: fire-stations-detail
    service: bodam-backend
    paths:
      - /api/fire-stations/~
    methods:
      - GET
    strip_path: false
    plugins:
      - name: rate-limiting
        config:
          minute: 100

  # User API routes
  - name: users-profile
    service: bodam-backend
    paths:
      - /api/users/profile
    methods:
      - GET
      - PUT
    strip_path: false
    plugins:
      - name: jwt
      - name: rate-limiting
        config:
          minute: 50

  - name: users-auth
    service: bodam-backend
    paths:
      - /api/auth/login
      - /api/auth/register
      - /api/auth/refresh
    methods:
      - POST
    strip_path: false
    plugins:
      - name: rate-limiting
        config:
          minute: 10  # Stricter rate limit for auth endpoints
          hour: 100

  # Admin API routes
  - name: admin-dashboard
    service: bodam-backend
    paths:
      - /api/admin/~
    methods:
      - GET
      - POST
      - PUT
      - DELETE
    strip_path: false
    plugins:
      - name: jwt
        config:
          claims_to_verify:
            - exp
            - role  # Verify admin role
      - name: rate-limiting
        config:
          minute: 200

  # News/Content API routes
  - name: news-list
    service: bodam-backend
    paths:
      - /api/news
    methods:
      - GET
    strip_path: false
    plugins:
      - name: rate-limiting
        config:
          minute: 150

  # WebSocket route for real-time notifications
  - name: websocket-notifications
    service: bodam-backend
    paths:
      - /api/ws
    protocols:
      - http
      - https
    strip_path: false
    plugins:
      - name: jwt

# Global plugins
plugins:
  - name: cors
    config:
      origins:
        - https://app.bodam.example
        - https://admin.bodam.example
      methods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Authorization
        - Content-Type
        - X-Request-ID
      exposed_headers:
        - X-RateLimit-Limit
        - X-RateLimit-Remaining
        - X-RateLimit-Reset
      credentials: true
      max_age: 3600

  - name: request-transformer
    config:
      add:
        headers:
          - X-Kong-Request-ID:$(uuid)
          - X-Forwarded-Proto:https

  - name: correlation-id
    config:
      header_name: X-Request-ID
      generator: uuid#counter
      echo_downstream: true

  - name: file-log
    config:
      path: /var/log/kong/access.log
      reopen: true

# Consumer groups (optional, for future use)
consumers:
  - username: admin-user
    custom_id: admin-001
    jwt_secrets:
      - key: admin-jwt-secret
        secret: your-secret-key-here
        algorithm: HS256
