# 백엔드 Deployment - FastAPI + Celery Worker 통합
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bodam-backend
  labels:
    app: bodam-backend
    tier: backend
spec:
  replicas: 1  # 단일 Pod
  selector:
    matchLabels:
      app: bodam-backend
  template:
    metadata:
      labels:
        app: bodam-backend
        tier: backend
    spec:
      imagePullSecrets:
      - name: regcred
      containers:
      # 컨테이너 1: FastAPI 백엔드 서버
      - name: fastapi
        image: bodam/backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http

        command:
        - uvicorn
        - src.main:app
        - --host
        - "0.0.0.0"
        - --port
        - "8080"

        env:
        # 데이터베이스 설정
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: bodam-secrets
              key: database-url

        # Redis 설정
        - name: REDIS_URL
          value: "redis://redis-service:6379/0"

        # Celery 설정
        - name: CELERY_BROKER_URL
          value: "redis://redis-service:6379/0"
        - name: CELERY_RESULT_BACKEND
          value: "redis://redis-service:6379/0"

        # JWT 설정
        - name: JWT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: bodam-secrets
              key: jwt-secret

        # API 설정
        - name: API_HOST
          value: "0.0.0.0"
        - name: API_PORT
          value: "8080"

        # 로그 설정
        - name: LOG_LEVEL
          value: "INFO"
        - name: LOG_FORMAT
          value: "json"

        # 환경 구분
        - name: ENVIRONMENT
          value: "staging"

        # 리소스 제한 (2vCPU/4GB 노드 기준 최적화)
        resources:
          requests:
            memory: "256Mi"  # 최소 메모리 요청
            cpu: "200m"      # 0.2 CPU (최소 요청)
          limits:
            memory: "512Mi"  # 최대 메모리 (OOM 방지)
            cpu: "500m"      # 0.5 CPU (최대 사용)
        
        # Health Check
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /readyz
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
