# 백엔드 Deployment - FastAPI + Celery Worker 통합
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bodam-backend
  labels:
    app: bodam-backend
    tier: backend
spec:
  replicas: 1  # 단일 Pod
  selector:
    matchLabels:
      app: bodam-backend
  template:
    metadata:
      labels:
        app: bodam-backend
        tier: backend
    spec:
      containers:
      # 컨테이너 1: FastAPI 백엔드 서버
      - name: fastapi
        image: bodamhub/bodam-backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http

        command:
        - uvicorn
        - src.main:app
        - --host
        - "0.0.0.0"
        - --port
        - "8080"
        - --workers
        - "1"

        env:
        # 데이터베이스 설정
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: bodam-secrets
              key: database-url

        # Redis 설정
        - name: REDIS_URL
          value: "redis://redis-service:6379/0"

        # Celery 설정
        - name: CELERY_BROKER_URL
          value: "redis://redis-service:6379/0"
        - name: CELERY_RESULT_BACKEND
          value: "redis://redis-service:6379/0"

        # JWT 설정
        - name: JWT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: bodam-secrets
              key: jwt-secret

        # API 설정
        - name: API_HOST
          value: "0.0.0.0"
        - name: API_PORT
          value: "8080"

        # 로그 설정
        - name: LOG_LEVEL
          value: "INFO"
        - name: LOG_FORMAT
          value: "json"

        # 환경 구분
        - name: ENVIRONMENT
          value: "staging"

        # CORS 설정
        - name: ALLOWED_ORIGINS
          valueFrom:
            secretKeyRef:
              name: bodam-secrets
              key: allowed-origins

        # Toss Payments 설정
        - name: TOSS_CLIENT_KEY
          valueFrom:
            secretKeyRef:
              name: toss-secrets
              key: client-key
        - name: TOSS_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: toss-secrets
              key: secret-key

        # 리소스 제한 (메모리 부족 환경 최적화)
        resources:
          requests:
            memory: "128Mi"  # 최소 메모리 요청
            cpu: "100m"      # 0.1 CPU (최소 요청)
          limits:
            memory: "256Mi"  # 최대 메모리 (OOM 방지)
            cpu: "300m"      # 0.3 CPU (최대 사용)
        
        # Health Check
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /readyz
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
      
      # 컨테이너 2: Celery Worker (모든 워커 역할 통합)
      - name: celery-worker
        image: bodamhub/bodam-backend:latest
        imagePullPolicy: IfNotPresent

        command:
        - celery
        - -A
        - src.workers.celery_app
        - worker
        - --loglevel=info
        - --concurrency=1
        - --max-tasks-per-child=100

        env:
        # 데이터베이스 설정
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: bodam-secrets
              key: database-url

        # Celery 설정
        - name: CELERY_BROKER_URL
          value: "redis://redis-service:6379/0"
        - name: CELERY_RESULT_BACKEND
          value: "redis://redis-service:6379/0"

        # Selenium 설정
        - name: SELENIUM_HEADLESS
          value: "true"
        - name: SELENIUM_DRIVER_POOL_SIZE
          value: "10"
        - name: SELENIUM_DEFAULT_TIMEOUT
          value: "30"

        # 로그 설정
        - name: LOG_LEVEL
          value: "INFO"
        - name: LOG_FORMAT
          value: "json"

        # 리소스 제한 (메모리 부족 환경 최적화)
        resources:
          requests:
            memory: "128Mi"  # 최소 메모리 요청
            cpu: "100m"      # 0.1 CPU (최소 요청)
          limits:
            memory: "256Mi"  # 최대 메모리 (OOM 방지)
            cpu: "300m"      # 0.3 CPU (최대 사용)
        
        # Health Check (Celery 상태 확인)
        livenessProbe:
          exec:
            command:
            - celery
            - -A
            - src.workers.celery_app
            - inspect
            - ping
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3

---
# 백엔드 Service
apiVersion: v1
kind: Service
metadata:
  name: bodam-backend-service
  labels:
    app: bodam-backend
spec:
  selector:
    app: bodam-backend
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
  type: ClusterIP
