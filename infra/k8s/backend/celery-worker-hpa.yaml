# Celery Worker HorizontalPodAutoscaler
# Celery Worker 컨테이너 자동 스케일링 설정
# 참고: 현재 아키텍처는 단일 Pod에 FastAPI + Celery Worker 통합
# 이 HPA는 향후 Celery Worker 분리 시 사용 가능
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: bodam-celery-worker
  namespace: bodam
  labels:
    app: bodam-celery-worker
    tier: worker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: bodam-celery-worker  # 향후 분리될 Celery Worker Deployment

  # 리소스 제한: 최소 1개, 최대 2개 Pod
  minReplicas: 1
  maxReplicas: 2

  # 메트릭 기반 스케일링
  metrics:
    # CPU 사용률 기준 (70% 목표)
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

    # 메모리 사용률 기준 (75% 목표)
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75

  # 스케일링 동작 정책
  behavior:
    # 스케일 업 정책 (작업 대기열 증가 시 빠른 확장)
    scaleUp:
      stabilizationWindowSeconds: 60  # 1분 안정화
      policies:
        # 100% 증가 (1개 → 2개)
        - type: Percent
          value: 100
          periodSeconds: 60
        # 또는 최대 1개씩 증가
        - type: Pods
          value: 1
          periodSeconds: 60
      # 위 정책 중 더 적극적인 것 선택
      selectPolicy: Max

    # 스케일 다운 정책 (보수적인 축소)
    scaleDown:
      stabilizationWindowSeconds: 300  # 5분 안정화 (작업 완료 대기)
      policies:
        # 50% 감소 (2개 → 1개)
        - type: Percent
          value: 50
          periodSeconds: 120
        # 또는 최대 1개씩 감소
        - type: Pods
          value: 1
          periodSeconds: 120
      # 위 정책 중 더 보수적인 것 선택
      selectPolicy: Min

---
