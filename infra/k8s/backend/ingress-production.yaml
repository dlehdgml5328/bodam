# Production Ingress - api.bodam.website
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bodam-prod-ingress
  namespace: bodam-prod
  annotations:
    # DigitalOcean Load Balancer
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # CORS
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://frontend-bodam.vercel.app"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, PATCH, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
    # Rate Limiting
    nginx.ingress.kubernetes.io/limit-rps: "100"
    # Timeouts
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
spec:
  tls:
  - hosts:
    - api.bodam.website
    secretName: bodam-prod-tls
  rules:
  - host: api.bodam.website
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: bodam-backend-service
            port:
              number: 80
