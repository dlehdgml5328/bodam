apiVersion: apps/v1
kind: Deployment
metadata:
  name: bodam-backend-blue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bodam-backend
      version: blue
  template:
    metadata:
      labels:
        app: bodam-backend
        version: blue
    spec:
      containers:
        - name: backend
          image: ghcr.io/bodam/backend:blue
          ports:
            - containerPort: 8000
