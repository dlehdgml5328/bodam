apiVersion: apps/v1
kind: Deployment
metadata:
  name: bodam-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bodam-backend
  template:
    metadata:
      labels:
        app: bodam-backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/bodam/backend:latest
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: bodam-secrets
                  key: database_url
            - name: REDIS_CACHE_URL
              value: redis://redis-cache-service:6379/0
            - name: CELERY_BROKER_URL
              value: redis://redis-queue-service:6379/0
            - name: CELERY_RESULT_BACKEND
              value: redis://redis-queue-service:6379/1
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: bodam-backend
spec:
  selector:
    app: bodam-backend
  ports:
    - name: http
      port: 80
      targetPort: 8000
