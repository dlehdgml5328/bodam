apiVersion: apps/v1
kind: Deployment
metadata:
  name: bodam-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bodam-backend
  template:
    metadata:
      labels:
        app: bodam-backend
    spec:
      imagePullSecrets:
        - name: registry-bodam
      containers:
        - name: backend
          image: registry.digitalocean.com/bodam/backend:preview-8916766215894615b9f91332a773db861febf3c7
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: bodam-secrets
                  key: database-url
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: bodam-secrets
                  key: jwt-secret
            - name: ALLOWED_ORIGINS
              value: "https://frontend-sigma-pearl-65.vercel.app,https://frontend-wheat-bodam.vercel.app,https://bodam.website,https://www.bodam.website"
            - name: REDIS_CACHE_URL
              value: redis://redis-cache-service:6379/0
            - name: CELERY_BROKER_URL
              value: redis://redis-queue-service:6379/0
            - name: CELERY_RESULT_BACKEND
              value: redis://redis-queue-service:6379/1
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.observability.svc.cluster.local:4318
            - name: OTEL_SERVICE_NAME
              value: backend-api
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.namespace=bodam,deployment.environment=production
            - name: OTEL_TRACES_SAMPLER
              value: always_on
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: bodam-backend
spec:
  selector:
    app: bodam-backend
  ports:
    - name: http
      port: 80
      targetPort: 8000
