apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bodam-backend
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "bodam-backend"
spec:
  rules:
    - host: api.bodam.example
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bodam-backend
                port:
                  number: 80
