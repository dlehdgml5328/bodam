apiVersion: v1
kind: Service
metadata:
  name: redis-semantic-service
  labels:
    app: redis-semantic
    component: semantic
    part-of: bodam
spec:
  type: ClusterIP
  selector:
    app: redis-semantic
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
    - name: insight
      port: 8001
      targetPort: 8001
