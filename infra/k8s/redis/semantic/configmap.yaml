apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-semantic-config
  labels:
    app: redis-semantic
    component: semantic
    part-of: bodam
data:
  redis-stack.conf: |
    maxmemory 2gb
    maxmemory-policy allkeys-lru
    appendonly yes
    appendfsync everysec
    save 3600 1
    # Redis Stack loads RediSearch/JSON/Graph modules automatically.
    # Additional semantic cache specific tuning.
    search-threads 4
