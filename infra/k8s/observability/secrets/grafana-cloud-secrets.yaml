# Grafana Cloud API Keys - Kubernetes Secret
# 사용 전 실제 credentials로 교체 필요

apiVersion: v1
kind: Secret
metadata:
  name: grafana-cloud-creds
  namespace: observability
type: Opaque
stringData:
  # Prometheus Remote Write
  prometheus-user: "YOUR_GRAFANA_CLOUD_PROMETHEUS_INSTANCE_ID"
  prometheus-pass: "YOUR_GRAFANA_CLOUD_API_KEY"

  # Loki Remote Write
  loki-user: "YOUR_GRAFANA_CLOUD_LOKI_USER_ID"
  loki-pass: "YOUR_GRAFANA_CLOUD_API_KEY"

  # Tempo Remote Write
  tempo-creds: "YOUR_BASE64_ENCODED_CREDENTIALS"
  # Base64 인코딩 방법: echo -n "instance_id:api_key" | base64

---
# Slack Webhook Secret (Alertmanager용)
apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-slack
  namespace: observability
type: Opaque
stringData:
  webhook-url: "https://hooks.slack.com/services/YOUR/WEBHOOK/URL"
  channel: "#bodam-alerts"

---
# 사용 가이드:
#
# 1. Grafana Cloud 가입 (Free Tier)
#    https://grafana.com/auth/sign-up/create-user
#
# 2. Stack 생성 후 다음 정보 수집:
#    - Prometheus: https://grafana.com/orgs/your-org/stacks/your-stack-id
#      → Details → "Remote Write Endpoint" 확인
#      → "Generate now" 클릭하여 API Key 생성
#
#    - Loki: 동일한 Stack에서 Loki URL 확인
#      → Details → "Loki" 섹션
#
#    - Tempo: 동일한 Stack에서 Tempo URL 확인
#      → Details → "Traces" 섹션
#
# 3. Slack Webhook URL 생성:
#    - https://api.slack.com/messaging/webhooks
#    - "Create New App" → "Incoming Webhooks"
#    - Webhook URL 복사
#
# 4. 이 파일에서 YOUR_* 부분을 실제 값으로 교체
#
# 5. Kubernetes에 Secret 적용:
#    kubectl apply -f infra/k8s/observability/secrets/grafana-cloud-secrets.yaml
#
# 6. Secret 확인:
#    kubectl get secrets -n observability
#    kubectl describe secret grafana-cloud-creds -n observability
