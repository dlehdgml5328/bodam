apiVersion: apps/v1
kind: Deployment
metadata:
  name: bodam-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bodam-frontend
  template:
    metadata:
      labels:
        app: bodam-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/bodam/frontend:latest
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_BASE_URL
              value: https://api.bodam.example
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: bodam-frontend
spec:
  selector:
    app: bodam-frontend
  ports:
    - name: http
      port: 80
      targetPort: 3000
