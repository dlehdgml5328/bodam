apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-worker
  labels:
    app: celery-worker
    part-of: bodam
spec:
  replicas: 2
  selector:
    matchLabels:
      app: celery-worker
  template:
    metadata:
      labels:
        app: celery-worker
        part-of: bodam
    spec:
      containers:
        - name: worker
          image: ghcr.io/bodam/backend:latest
          command:
            - sh
            - -c
            - "celery -A src.worker.celery_app worker --loglevel=info --concurrency=4"
          env:
            - name: CELERY_BROKER_URL
              value: redis://redis-queue-service:6379/0
            - name: CELERY_RESULT_BACKEND
              value: redis://redis-queue-service:6379/1
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: bodam-secrets
                  key: database_url
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            exec:
              command:
                - celery
                - -A
                - src.worker.celery_app
                - inspect
                - ping
            initialDelaySeconds: 30
            periodSeconds: 30
          livenessProbe:
            exec:
              command:
                - celery
                - -A
                - src.worker.celery_app
                - inspect
                - ping
            initialDelaySeconds: 60
            periodSeconds: 60
