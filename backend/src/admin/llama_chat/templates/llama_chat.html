<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Llama AI 채팅 - BoDam Admin</title>

    <!-- TailwindCSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* Custom scrollbar */
        .chat-messages::-webkit-scrollbar {
            width: 8px;
        }
        .chat-messages::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        .chat-messages::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 4px;
        }
        .chat-messages::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

        /* Message animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message-fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }

        /* Loading dots animation */
        @keyframes blink {
            0%, 20%, 50%, 80%, 100% {
                opacity: 1;
            }
            40% {
                opacity: 0.4;
            }
            60% {
                opacity: 0.4;
            }
        }

        .loading-dot {
            animation: blink 1.4s infinite both;
        }

        .loading-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .loading-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        /* Code block styling */
        pre {
            background-color: #282c34;
            color: #abb2bf;
            padding: 1rem;
            border-radius: 0.5rem;
            overflow-x: auto;
            font-family: 'Courier New', monospace;
            font-size: 0.875rem;
        }

        code {
            font-family: 'Courier New', monospace;
        }
    </style>
</head>
<body class="bg-gray-100">
    <div class="container mx-auto max-w-6xl h-screen flex flex-col p-4">
        <!-- Header -->
        <div class="bg-white rounded-t-lg shadow-md p-4 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <i class="fas fa-robot text-3xl text-blue-600"></i>
                <div>
                    <h1 class="text-2xl font-bold text-gray-800">Llama AI 채팅</h1>
                    <p class="text-sm text-gray-500">Knowledge Graph 기반 자연어 쿼리</p>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <button id="clearBtn" class="px-4 py-2 bg-red-500 text-white rounded-lg hover:bg-red-600 transition-colors flex items-center space-x-2">
                    <i class="fas fa-trash"></i>
                    <span>대화 초기화</span>
                </button>
                <button id="newSessionBtn" class="px-4 py-2 bg-green-500 text-white rounded-lg hover:bg-green-600 transition-colors flex items-center space-x-2">
                    <i class="fas fa-plus"></i>
                    <span>새 세션</span>
                </button>
            </div>
        </div>

        <!-- Session Info -->
        <div class="bg-blue-50 px-4 py-2 flex items-center justify-between border-b border-blue-200">
            <div class="flex items-center space-x-2">
                <i class="fas fa-info-circle text-blue-600"></i>
                <span class="text-sm text-gray-700">세션 ID: <strong id="sessionId">로딩 중...</strong></span>
            </div>
            <div class="flex items-center space-x-2">
                <span id="cacheIndicator" class="text-xs px-2 py-1 rounded-full bg-gray-200 text-gray-600">
                    <i class="fas fa-circle"></i> 캐시 대기
                </span>
                <span id="executionTime" class="text-xs px-2 py-1 rounded-full bg-gray-200 text-gray-600">
                    <i class="fas fa-clock"></i> 0ms
                </span>
            </div>
        </div>

        <!-- Chat Messages -->
        <div id="chatMessages" class="chat-messages flex-1 bg-white p-6 overflow-y-auto space-y-4">
            <!-- Welcome Message -->
            <div class="flex items-start space-x-3 message-fade-in">
                <div class="flex-shrink-0">
                    <i class="fas fa-robot text-2xl text-blue-600"></i>
                </div>
                <div class="flex-1">
                    <div class="bg-blue-100 rounded-lg p-4">
                        <p class="text-gray-800">
                            안녕하세요! Llama AI 채팅 서비스입니다. 🤖
                        </p>
                        <p class="text-gray-700 mt-2">
                            자연어로 질문하시면 Knowledge Graph를 조회하여 답변해드립니다.
                        </p>
                        <div class="mt-3 space-y-1 text-sm text-gray-600">
                            <p><strong>예시 질문:</strong></p>
                            <ul class="list-disc list-inside space-y-1 ml-2">
                                <li>"서울에 있는 소방서는 몇 개인가요?"</li>
                                <li>"최근 한 달간 화재 사고 현황을 알려주세요"</li>
                                <li>"후원금이 가장 많은 소방서는?"</li>
                            </ul>
                        </div>
                    </div>
                    <p class="text-xs text-gray-500 mt-1">방금 전</p>
                </div>
            </div>
        </div>

        <!-- Input Area -->
        <div class="bg-white rounded-b-lg shadow-md p-4 border-t border-gray-200">
            <form id="chatForm" class="flex items-end space-x-3">
                <div class="flex-1">
                    <textarea
                        id="queryInput"
                        rows="2"
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent resize-none"
                        placeholder="질문을 입력하세요... (Enter: 전송, Shift+Enter: 줄바꿈)"
                        maxlength="500"
                    ></textarea>
                    <div class="flex items-center justify-between mt-1">
                        <span id="charCount" class="text-xs text-gray-500">0 / 500</span>
                        <label class="flex items-center space-x-1 text-xs text-gray-600">
                            <input type="checkbox" id="explainCheckbox" class="rounded">
                            <span>SQL 쿼리 표시</span>
                        </label>
                    </div>
                </div>
                <button
                    type="submit"
                    id="sendBtn"
                    class="px-6 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors flex items-center space-x-2 disabled:opacity-50 disabled:cursor-not-allowed"
                >
                    <i class="fas fa-paper-plane"></i>
                    <span>전송</span>
                </button>
            </form>
        </div>
    </div>

    <script>
        // 전역 변수
        let sessionId = null;
        const API_BASE = '/admin/api/chat';

        // DOM 요소
        const chatMessages = document.getElementById('chatMessages');
        const chatForm = document.getElementById('chatForm');
        const queryInput = document.getElementById('queryInput');
        const sendBtn = document.getElementById('sendBtn');
        const clearBtn = document.getElementById('clearBtn');
        const newSessionBtn = document.getElementById('newSessionBtn');
        const sessionIdEl = document.getElementById('sessionId');
        const charCount = document.getElementById('charCount');
        const explainCheckbox = document.getElementById('explainCheckbox');
        const cacheIndicator = document.getElementById('cacheIndicator');
        const executionTime = document.getElementById('executionTime');

        // 세션 생성
        async function createSession() {
            try {
                const response = await fetch(`${API_BASE}/session`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });

                if (!response.ok) {
                    throw new Error('세션 생성 실패');
                }

                const data = await response.json();
                sessionId = data.session_id;
                sessionIdEl.textContent = sessionId.slice(0, 8) + '...';

                console.log('세션 생성됨:', sessionId);
            } catch (error) {
                console.error('세션 생성 오류:', error);
                alert('세션 생성에 실패했습니다.');
            }
        }

        // 메시지 추가
        function addMessage(role, content, metadata = {}) {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'flex items-start space-x-3 message-fade-in';

            const isUser = role === 'user';
            const iconClass = isUser ? 'fa-user' : 'fa-robot';
            const bgClass = isUser ? 'bg-gray-100' : 'bg-blue-100';
            const iconColor = isUser ? 'text-gray-600' : 'text-blue-600';

            messageDiv.innerHTML = `
                <div class="flex-shrink-0">
                    <i class="fas ${iconClass} text-2xl ${iconColor}"></i>
                </div>
                <div class="flex-1">
                    <div class="${bgClass} rounded-lg p-4">
                        <p class="text-gray-800 whitespace-pre-wrap">${escapeHtml(content)}</p>
                        ${metadata.sql_query ? `
                            <div class="mt-3">
                                <p class="text-xs text-gray-600 mb-1"><strong>SQL 쿼리:</strong></p>
                                <pre class="text-xs">${escapeHtml(metadata.sql_query)}</pre>
                            </div>
                        ` : ''}
                        ${metadata.query_type ? `
                            <p class="text-xs text-gray-600 mt-2">
                                <i class="fas fa-tag"></i> ${metadata.query_type}
                            </p>
                        ` : ''}
                    </div>
                    <p class="text-xs text-gray-500 mt-1">방금 전</p>
                </div>
            `;

            chatMessages.appendChild(messageDiv);
            scrollToBottom();
        }

        // 로딩 인디케이터 표시
        function showLoading() {
            const loadingDiv = document.createElement('div');
            loadingDiv.id = 'loadingIndicator';
            loadingDiv.className = 'flex items-start space-x-3 message-fade-in';
            loadingDiv.innerHTML = `
                <div class="flex-shrink-0">
                    <i class="fas fa-robot text-2xl text-blue-600"></i>
                </div>
                <div class="flex-1">
                    <div class="bg-blue-100 rounded-lg p-4">
                        <div class="flex items-center space-x-2">
                            <span class="text-gray-700">생각 중</span>
                            <div class="flex space-x-1">
                                <div class="loading-dot w-2 h-2 bg-blue-600 rounded-full"></div>
                                <div class="loading-dot w-2 h-2 bg-blue-600 rounded-full"></div>
                                <div class="loading-dot w-2 h-2 bg-blue-600 rounded-full"></div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            chatMessages.appendChild(loadingDiv);
            scrollToBottom();
        }

        // 로딩 인디케이터 제거
        function hideLoading() {
            const loadingDiv = document.getElementById('loadingIndicator');
            if (loadingDiv) {
                loadingDiv.remove();
            }
        }

        // 스크롤 하단으로 이동
        function scrollToBottom() {
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // HTML 이스케이프
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 쿼리 전송
        async function sendQuery(query) {
            if (!query.trim() || !sessionId) {
                return;
            }

            // 사용자 메시지 추가
            addMessage('user', query);

            // 입력창 초기화
            queryInput.value = '';
            updateCharCount();

            // 전송 버튼 비활성화
            sendBtn.disabled = true;
            queryInput.disabled = true;

            // 로딩 표시
            showLoading();

            try {
                const response = await fetch(`${API_BASE}/query`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        query: query,
                        session_id: sessionId,
                        max_results: 10,
                        explain: explainCheckbox.checked
                    })
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || '쿼리 실행 실패');
                }

                const data = await response.json();

                // 로딩 제거
                hideLoading();

                // 응답 메시지 추가
                addMessage('assistant', data.response, {
                    sql_query: data.sql_query,
                    query_type: data.query_type
                });

                // 캐시 인디케이터 업데이트
                if (data.cached) {
                    cacheIndicator.innerHTML = '<i class="fas fa-circle text-green-500"></i> 캐시 히트';
                    cacheIndicator.className = 'text-xs px-2 py-1 rounded-full bg-green-100 text-green-700';
                } else {
                    cacheIndicator.innerHTML = '<i class="fas fa-circle text-blue-500"></i> 신규 쿼리';
                    cacheIndicator.className = 'text-xs px-2 py-1 rounded-full bg-blue-100 text-blue-700';
                }

                // 실행 시간 업데이트
                executionTime.innerHTML = `<i class="fas fa-clock"></i> ${data.execution_time_ms.toFixed(0)}ms`;

            } catch (error) {
                console.error('쿼리 전송 오류:', error);
                hideLoading();
                addMessage('assistant', `오류: ${error.message}`);
            } finally {
                // 전송 버튼 활성화
                sendBtn.disabled = false;
                queryInput.disabled = false;
                queryInput.focus();
            }
        }

        // 대화 초기화
        async function clearHistory() {
            if (!sessionId) return;

            if (!confirm('대화 기록을 모두 삭제하시겠습니까?')) {
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/clear/${sessionId}`, {
                    method: 'POST'
                });

                if (!response.ok) {
                    throw new Error('초기화 실패');
                }

                // 메시지 영역 초기화
                chatMessages.innerHTML = '';

                // 환영 메시지 추가
                addMessage('assistant', '대화 기록이 초기화되었습니다. 새로운 질문을 시작해주세요!');

                console.log('대화 기록 초기화됨');
            } catch (error) {
                console.error('초기화 오류:', error);
                alert('대화 기록 초기화에 실패했습니다.');
            }
        }

        // 새 세션 생성
        async function startNewSession() {
            if (!confirm('새 세션을 시작하시겠습니까? (현재 대화는 유지됩니다)')) {
                return;
            }

            await createSession();

            // 메시지 영역 초기화
            chatMessages.innerHTML = '';
            addMessage('assistant', '새 세션이 시작되었습니다. 질문을 입력해주세요!');
        }

        // 문자 수 업데이트
        function updateCharCount() {
            const count = queryInput.value.length;
            charCount.textContent = `${count} / 500`;
        }

        // 이벤트 리스너
        chatForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const query = queryInput.value.trim();
            if (query) {
                sendQuery(query);
            }
        });

        // Enter 키 처리 (Shift+Enter는 줄바꿈)
        queryInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                chatForm.dispatchEvent(new Event('submit'));
            }
        });

        queryInput.addEventListener('input', updateCharCount);

        clearBtn.addEventListener('click', clearHistory);
        newSessionBtn.addEventListener('click', startNewSession);

        // 초기화
        (async () => {
            await createSession();
            queryInput.focus();
        })();
    </script>
</body>
</html>
