# Loki Configuration Contract
# Purpose: Define log aggregation, storage, and Grafana Cloud integration
# Reference: research.md Section 3 (Loki + Promtail)

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: info

# Ingester configuration
ingester:
  lifecycler:
    address: 127.0.0.1
    ring:
      kvstore:
        store: inmemory
      replication_factor: 1
    final_sleep: 0s
  chunk_idle_period: 1h
  max_chunk_age: 1h
  chunk_target_size: 1048576
  chunk_retain_period: 30s
  max_transfer_retries: 0

# Schema configuration
schema_config:
  configs:
    - from: 2024-01-01
      store: boltdb-shipper
      object_store: filesystem
      schema: v11
      index:
        prefix: index_
        period: 24h

# Local storage (3-day retention)
storage_config:
  boltdb_shipper:
    active_index_directory: /loki/boltdb-shipper-active
    cache_location: /loki/boltdb-shipper-cache
    cache_ttl: 24h
    shared_store: filesystem
  filesystem:
    directory: /loki/chunks

# Compactor for retention management
compactor:
  working_directory: /loki/compactor
  shared_store: filesystem
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 150

# Limits configuration
limits_config:
  enforce_metric_name: false
  reject_old_samples: true
  reject_old_samples_max_age: 168h  # 7 days
  ingestion_rate_mb: 10
  ingestion_burst_size_mb: 20
  max_label_name_length: 1024
  max_label_value_length: 2048
  max_label_names_per_series: 30
  # Retention: 3 days for local storage
  retention_period: 72h

# Query frontend configuration
query_range:
  align_queries_with_step: true
  max_retries: 5
  cache_results: true
  results_cache:
    cache:
      enable_fifocache: true
      fifocache:
        max_size_bytes: 500MB
        validity: 24h

# Table manager (for retention)
table_manager:
  retention_deletes_enabled: true
  retention_period: 72h

# Ruler configuration (for alerting)
ruler:
  storage:
    type: local
    local:
      directory: /loki/rules
  rule_path: /loki/rules-temp
  alertmanager_url: http://alertmanager:9093
  ring:
    kvstore:
      store: inmemory
  enable_api: true
  enable_alertmanager_v2: true

---
# Promtail Configuration (Log Shipper)
# Deploy as DaemonSet on each Kubernetes node

server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: info

# Loki client configuration
clients:
  # Local Loki instance
  - url: http://loki:3100/loki/api/v1/push
    backoff_config:
      min_period: 500ms
      max_period: 5m
      max_retries: 10
    timeout: 10s

  # Grafana Cloud Loki (remote write)
  - url: https://logs-prod-us-central-0.grafana.net/loki/api/v1/push
    basic_auth:
      username: YOUR_GRAFANA_CLOUD_LOKI_USER_ID  # Replace with actual user ID
      password: YOUR_GRAFANA_CLOUD_API_KEY  # Replace with actual API key
    backoff_config:
      min_period: 1s
      max_period: 10m
      max_retries: 5
    timeout: 30s

# Positions file (tracks log file positions)
positions:
  filename: /tmp/positions.yaml

# Scrape configurations
scrape_configs:
  # Backend API logs (JSON format)
  - job_name: backend-api
    static_configs:
      - targets:
          - localhost
        labels:
          job: backend-api
          service: backend
          __path__: /var/log/backend/*.log
    pipeline_stages:
      # Parse JSON logs
      - json:
          expressions:
            timestamp: timestamp
            level: level
            message: message
            trace_id: trace_id
            span_id: span_id
            service: service
      # Set timestamp
      - timestamp:
          source: timestamp
          format: RFC3339Nano
      # Set log level
      - labels:
          level:
          trace_id:
          service:
      # Drop debug logs to save ingestion volume
      - match:
          selector: '{level="debug"}'
          action: drop

  # Celery worker logs
  - job_name: celery-worker
    static_configs:
      - targets:
          - localhost
        labels:
          job: celery-worker
          service: celery
          __path__: /var/log/celery/*.log
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            message: message
            task_id: task_id
      - timestamp:
          source: timestamp
          format: RFC3339Nano
      - labels:
          level:
          task_id:

  # Kong Gateway logs
  - job_name: kong-gateway
    static_configs:
      - targets:
          - localhost
        labels:
          job: kong
          service: gateway
          __path__: /var/log/kong/*.log
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            status: status
            latency: latency_ms
            client_ip: client_ip
      - labels:
          status:

  # NGINX logs
  - job_name: nginx
    static_configs:
      - targets:
          - localhost
        labels:
          job: nginx
          service: nginx
          __path__: /var/log/nginx/*.log
    pipeline_stages:
      - regex:
          expression: '^(?P<remote_addr>[\w\.]+) - (?P<remote_user>[^ ]*) \[(?P<time_local>.*)\] "(?P<method>\w+) (?P<request_uri>[^ ]*) (?P<http_version>[^"]*)" (?P<status>\d{3}) (?P<body_bytes_sent>\d+)'
      - labels:
          method:
          status:

  # Kubernetes pod logs (if deployed on k8s)
  - job_name: kubernetes-pods
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        target_label: app
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
    pipeline_stages:
      - docker: {}
      - json:
          expressions:
            level: level
            message: message
      - labels:
          level:
