openapi: 3.0.3
info:
  title: 보담 기부 API
  description: 기부 및 정기결제 관리 API
  version: 1.1.0

servers:
  - url: https://api.bodam.example
    description: 프로덕션 서버

paths:
  /donations:
    get:
      summary: 기부 내역 조회
      description: 인증된 사용자의 기부 내역을 페이지 단위로 조회합니다.
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, completed, failed, refunded]
        - name: mode
          in: query
          schema:
            type: string
            enum: [single, multiple]
      responses:
        '200':
          description: 기부 내역 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  donations:
                    type: array
                    items:
                      $ref: '#/components/schemas/Donation'
                  total:
                    type: integer
                  page:
                    type: integer
                  limit:
                    type: integer
    post:
      summary: 기부 결제 준비
      description: 일시/복수/정기/단체 기부를 생성하고 Toss 결제 또는 빌링 인증 정보를 반환합니다.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DonationCheckoutRequest'
      responses:
        '201':
          description: 결제 준비 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DonationCheckoutResponse'
        '400':
          description: 잘못된 요청 데이터
        '404':
          description: 대상 소방서/그룹을 찾을 수 없음

  /donations/{donation_id}:
    get:
      summary: 기부 상세 조회
      description: 특정 기부의 전체 정보를 조회합니다.
      security:
        - bearerAuth: []
      parameters:
        - name: donation_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 기부 상세 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DonationDetail'
        '403':
          description: 접근 권한 없음
        '404':
          description: 기부를 찾을 수 없음

  /donations/{donation_id}/receipt:
    get:
      summary: 영수증 다운로드
      security:
        - bearerAuth: []
      parameters:
        - name: donation_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 영수증 PDF
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '403': { description: 접근 권한 없음 }
        '404': { description: 영수증을 찾을 수 없음 }

  /donations/{donation_id}/refund:
    post:
      summary: 환불 요청
      security:
        - bearerAuth: []
      parameters:
        - name: donation_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  minLength: 10
                  maxLength: 500
      responses:
        '201':
          description: 환불 요청 접수
          content:
            application/json:
              schema:
                type: object
                properties:
                  refund_id:
                    type: string
                    format: uuid
                  status:
                    type: string
                    example: pending_review
                  message:
                    type: string
                    example: 환불 요청이 접수되었습니다
        '400': { description: 환불 불가능한 상태 }
        '403': { description: 접근 권한 없음 }

  /subscriptions:
    get:
      summary: 정기 기부 구독 목록
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 구독 목록 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  subscriptions:
                    type: array
                    items:
                      $ref: '#/components/schemas/Subscription'
  /subscriptions/{subscription_id}/pause:
    post:
      summary: 정기 기부 일시정지
      security:
        - bearerAuth: []
      parameters:
        - name: subscription_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200': { description: 일시정지 완료 }
        '400': { description: 처리 불가 상태 }
        '404': { description: 구독을 찾을 수 없음 }
  /subscriptions/{subscription_id}/resume:
    post:
      summary: 정기 기부 재개
      security:
        - bearerAuth: []
      parameters:
        - name: subscription_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200': { description: 재개 완료 }
        '400': { description: 처리 불가 상태 }
        '404': { description: 구독을 찾을 수 없음 }
  /subscriptions/{subscription_id}/cancel:
    post:
      summary: 정기 기부 해지
      security:
        - bearerAuth: []
      parameters:
        - name: subscription_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200': { description: 해지 완료 }
        '400': { description: 처리 불가 상태 }
        '404': { description: 구독을 찾을 수 없음 }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    DonationCheckoutRequest:
      type: object
      required: [mode, amount]
      properties:
        mode:
          type: string
          enum: [single, multiple]
          description: 단일/복수 기부 모드
        multiple_type:
          type: string
          enum: [split, each, custom]
          description: 복수 기부 시 분배 방식
        amount:
          type: number
          format: decimal
          minimum: 1000
          description: 총 결제 금액
        currency:
          type: string
          default: KRW
        fire_station_id:
          type: string
          format: uuid
          description: 단일 기부 시 대상 소방서 ID
        allocations:
          type: array
          items:
            $ref: '#/components/schemas/DonationAllocationInput'
          description: 복수 기부 시 소방서별 분배 정보
        donor:
          $ref: '#/components/schemas/DonorInfoInput'
        group:
          $ref: '#/components/schemas/GroupDonationInput'
        regular:
          $ref: '#/components/schemas/RegularDonationInput'
        message:
          type: string
          maxLength: 500
        metadata:
          type: object
          additionalProperties: true
        success_redirect_url:
          type: string
          format: uri
          description: 결제 성공 후 이동할 URL
        fail_redirect_url:
          type: string
          format: uri
          description: 결제 실패 시 이동할 URL
    DonationAllocationInput:
      type: object
      required: [fire_station_id, amount]
      properties:
        fire_station_id:
          type: string
          format: uuid
        amount:
          type: number
          format: decimal
          minimum: 0
        allocation_type:
          type: string
          enum: [primary, split, each, custom]
          default: primary
    DonorInfoInput:
      type: object
      properties:
        display_name:
          type: string
          description: 표시용 이름 (익명일 경우 노출)
        email:
          type: string
          format: email
        phone:
          type: string
        is_anonymous:
          type: boolean
          default: false
        needs_receipt:
          type: boolean
          default: false
        id_number:
          type: string
          description: 기부금 영수증 발급용 식별 번호
    GroupDonationInput:
      type: object
      properties:
        enabled:
          type: boolean
          default: false
        group_id:
          type: string
          format: uuid
        group_code:
          type: string
        group_name:
          type: string
        contact_name:
          type: string
        contact_email:
          type: string
          format: email
        contact_phone:
          type: string
    RegularDonationInput:
      type: object
      properties:
        enabled:
          type: boolean
          default: false
        cycle:
          type: string
          enum: [monthly, quarterly, yearly]
        start_date:
          type: string
          format: date
        customer_key:
          type: string
          description: Toss Customer Key (있을 경우)
    DonationCheckoutResponse:
      type: object
      properties:
        donation_id:
          type: string
          format: uuid
        order_id:
          type: string
        payment_url:
          type: string
          format: uri
          description: 일시 결제 URL
        billing_auth_url:
          type: string
          format: uri
          description: 정기 기부 빌링 인증 URL (정기일 때)
        subscription_id:
          type: string
          format: uuid
    Donation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        mode:
          type: string
          enum: [single, multiple]
        amount:
          type: number
          format: decimal
        currency:
          type: string
        status:
          type: string
          enum: [pending, completed, failed, refunded]
        message:
          type: string
        is_anonymous:
          type: boolean
        needs_receipt:
          type: boolean
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        fire_station:
          $ref: '#/components/schemas/FireStationSummary'
        allocations:
          type: array
          items:
            $ref: '#/components/schemas/DonationAllocationSummary'
        group:
          $ref: '#/components/schemas/GroupDonationSummary'
        regular:
          $ref: '#/components/schemas/RegularDonationSummary'
        payment:
          $ref: '#/components/schemas/DonationPaymentInfo'
    DonationDetail:
      allOf:
        - $ref: '#/components/schemas/Donation'
        - type: object
          properties:
            receipt_url:
              type: string
              format: uri
            refund:
              $ref: '#/components/schemas/RefundInfo'
    DonationAllocationSummary:
      type: object
      properties:
        fire_station:
          $ref: '#/components/schemas/FireStationSummary'
        amount:
          type: number
          format: decimal
        allocation_type:
          type: string
          enum: [primary, split, each, custom]
    FireStationSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        region:
          type: string
        district:
          type: string
    GroupDonationSummary:
      type: object
      properties:
        group_id:
          type: string
          format: uuid
        group_name:
          type: string
        is_anonymous:
          type: boolean
        contact_name:
          type: string
    RegularDonationSummary:
      type: object
      properties:
        subscription_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [active, paused, cancelled]
        cycle:
          type: string
          enum: [monthly, quarterly, yearly]
        next_billing_at:
          type: string
          format: date-time
    DonationPaymentInfo:
      type: object
      properties:
        method:
          type: string
        toss_order_id:
          type: string
        toss_payment_key:
          type: string
    RefundInfo:
      type: object
      properties:
        refund_id:
          type: string
          format: uuid
        status:
          type: string
        reason:
          type: string
        requested_at:
          type: string
          format: date-time
    Subscription:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [active, paused, cancelled]
        cycle:
          type: string
          enum: [monthly, quarterly, yearly]
        amount:
          type: number
          format: decimal
        currency:
          type: string
        next_billing_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
        paused_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
        fire_stations:
          type: array
          items:
            $ref: '#/components/schemas/FireStationSummary'
        billing_customer_key:
          type: string
        billing_key:
          type: string
