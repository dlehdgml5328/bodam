openapi: 3.0.3
info:
  title: 보담 기부 API
  description: 기부 및 결제 관리 API
  version: 1.0.0

servers:
  - url: https://api.bodam.example
    description: 프로덕션 서버

paths:
  /donations:
    get:
      summary: 기부 내역 조회
      description: 사용자의 기부 내역 목록 조회
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, completed, failed, refunded]
      responses:
        '200':
          description: 기부 내역 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  donations:
                    type: array
                    items:
                      $ref: '#/components/schemas/Donation'
                  total:
                    type: integer
                  page:
                    type: integer
                  limit:
                    type: integer

    post:
      summary: 새 기부 생성
      description: 일시 또는 정기 기부 생성
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - fire_station_id
                - amount
                - type
              properties:
                fire_station_id:
                  type: string
                  format: uuid
                  description: 기부 대상 소방서 ID
                amount:
                  type: number
                  format: decimal
                  minimum: 1000
                  description: 기부 금액 (최소 1,000원)
                type:
                  type: string
                  enum: [one_time, recurring]
                  description: 기부 유형
                frequency:
                  type: string
                  enum: [monthly, yearly]
                  description: 정기결제 주기 (recurring 타입일 때 필수)
                message:
                  type: string
                  maxLength: 500
                  description: 기부 메시지 (선택)
                is_anonymous:
                  type: boolean
                  default: false
                  description: 익명 기부 여부
      responses:
        '201':
          description: 기부 생성 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  donation_id:
                    type: string
                    format: uuid
                  payment_url:
                    type: string
                    description: Toss 결제 페이지 URL
                  order_id:
                    type: string
                    description: 주문 번호
        '400':
          description: 잘못된 요청 데이터
        '404':
          description: 소방서를 찾을 수 없음

  /donations/{donation_id}:
    get:
      summary: 기부 상세 조회
      description: 특정 기부의 상세 정보 조회
      security:
        - bearerAuth: []
      parameters:
        - name: donation_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 기부 상세 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DonationDetail'
        '403':
          description: 접근 권한 없음 (다른 사용자의 기부)
        '404':
          description: 기부를 찾을 수 없음

  /donations/{donation_id}/receipt:
    get:
      summary: 영수증 다운로드
      description: 기부 영수증 PDF 다운로드
      security:
        - bearerAuth: []
      parameters:
        - name: donation_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 영수증 PDF
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '403':
          description: 접근 권한 없음
        '404':
          description: 영수증을 찾을 수 없음

  /donations/{donation_id}/refund:
    post:
      summary: 환불 요청
      description: 완료된 기부에 대한 환불 요청
      security:
        - bearerAuth: []
      parameters:
        - name: donation_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reason
              properties:
                reason:
                  type: string
                  minLength: 10
                  maxLength: 500
                  description: 환불 사유
      responses:
        '201':
          description: 환불 요청 접수
          content:
            application/json:
              schema:
                type: object
                properties:
                  refund_id:
                    type: string
                    format: uuid
                  status:
                    type: string
                    example: "pending_review"
                  message:
                    type: string
                    example: "환불 요청이 접수되었습니다"
        '400':
          description: 환불 불가능한 상태
        '403':
          description: 접근 권한 없음

  /subscriptions:
    get:
      summary: 정기결제 목록 조회
      description: 사용자의 정기결제 구독 목록
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 정기결제 목록 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  subscriptions:
                    type: array
                    items:
                      $ref: '#/components/schemas/Subscription'

  /subscriptions/{subscription_id}/cancel:
    post:
      summary: 정기결제 취소
      description: 활성 정기결제 취소
      security:
        - bearerAuth: []
      parameters:
        - name: subscription_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 정기결제 취소 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "정기결제가 취소되었습니다"
        '403':
          description: 접근 권한 없음
        '404':
          description: 정기결제를 찾을 수 없음

components:
  schemas:
    Donation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        fire_station:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            region:
              type: string
        amount:
          type: number
          format: decimal
        type:
          type: string
          enum: [one_time, recurring]
        status:
          type: string
          enum: [pending, completed, failed, refunded]
        message:
          type: string
        is_anonymous:
          type: boolean
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time

    DonationDetail:
      allOf:
        - $ref: '#/components/schemas/Donation'
        - type: object
          properties:
            payment_method:
              type: string
            toss_payment_key:
              type: string
            receipt_url:
              type: string
            refund_info:
              type: object
              properties:
                refund_id:
                  type: string
                  format: uuid
                status:
                  type: string
                reason:
                  type: string
                requested_at:
                  type: string
                  format: date-time

    Subscription:
      type: object
      properties:
        id:
          type: string
          format: uuid
        fire_station:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
        amount:
          type: number
          format: decimal
        frequency:
          type: string
          enum: [monthly, yearly]
        status:
          type: string
          enum: [active, paused, cancelled]
        next_payment_date:
          type: string
          format: date
        created_at:
          type: string
          format: date-time
        last_payment_date:
          type: string
          format: date-time

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT