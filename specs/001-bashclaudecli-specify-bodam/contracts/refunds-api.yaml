openapi: 3.0.3
info:
  title: Refunds API
  version: 1.0.0
paths:
  /refunds:
    get:
      summary: List refunds
      responses:
        '200':
          description: Refund list
  /refunds/{id}/approve:
    post:
      summary: Approve refund
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Approved
