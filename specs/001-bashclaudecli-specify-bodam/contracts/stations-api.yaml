openapi: 3.0.3
info:
  title: 보담 소방서 API
  description: 소방서 정보 및 지리 검색 API
  version: 1.0.0

servers:
  - url: https://api.bodam.example
    description: 프로덕션 서버

paths:
  /stations:
    get:
      summary: 소방서 목록 조회
      description: 소방서 목록을 페이지네이션으로 조회
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: region
          in: query
          schema:
            type: string
          description: 지역 필터 (시/도)
        - name: district
          in: query
          schema:
            type: string
          description: 구/군 필터
        - name: search
          in: query
          schema:
            type: string
          description: 소방서명 검색
      responses:
        '200':
          description: 소방서 목록 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  stations:
                    type: array
                    items:
                      $ref: '#/components/schemas/FireStation'
                  total:
                    type: integer
                  page:
                    type: integer
                  limit:
                    type: integer

  /stations/nearby:
    get:
      summary: 근처 소방서 검색
      description: 지정된 좌표 근처의 소방서 검색
      parameters:
        - name: lat
          in: query
          required: true
          schema:
            type: number
            format: float
          description: 위도
        - name: lng
          in: query
          required: true
          schema:
            type: number
            format: float
          description: 경도
        - name: radius
          in: query
          schema:
            type: number
            default: 5000
            maximum: 50000
          description: 검색 반경 (미터, 최대 50km)
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
            maximum: 50
      responses:
        '200':
          description: 근처 소방서 검색 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  stations:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/FireStation'
                        - type: object
                          properties:
                            distance:
                              type: number
                              format: float
                              description: 거리 (미터)

  /stations/{station_id}:
    get:
      summary: 소방서 상세 조회
      description: 특정 소방서의 상세 정보 조회
      parameters:
        - name: station_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 소방서 상세 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FireStationDetail'
        '404':
          description: 소방서를 찾을 수 없음

  /stations/{station_id}/rankings:
    get:
      summary: 소방서별 기부자 랭킹
      description: 특정 소방서의 기부자 순위 조회
      parameters:
        - name: station_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: period
          in: query
          schema:
            type: string
            enum: [monthly, yearly, all_time]
            default: all_time
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
            maximum: 100
      responses:
        '200':
          description: 랭킹 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  rankings:
                    type: array
                    items:
                      $ref: '#/components/schemas/Ranking'
                  period:
                    type: string
                  calculated_at:
                    type: string
                    format: date-time

  /stations/{station_id}/incidents:
    get:
      summary: 소방서 관련 사건 조회
      description: 특정 소방서 근처의 화재 관련 사건 조회
      parameters:
        - name: station_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: days
          in: query
          schema:
            type: integer
            default: 7
            maximum: 30
          description: 조회 기간 (일)
      responses:
        '200':
          description: 사건 목록 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  incidents:
                    type: array
                    items:
                      $ref: '#/components/schemas/NewsContent'

  /emergency-stations:
    get:
      summary: 실시간 소방서 출동 현황
      description: 긴급 출동 및 현장 대응 중인 소방서 현황을 조회합니다.
      parameters:
        - name: region
          in: query
          required: false
          schema:
            type: string
          description: 시/도 필터
        - name: priority
          in: query
          required: false
          schema:
            type: string
            enum: [high, medium, low]
          description: 긴급도 필터
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            maximum: 200
          description: 조회 대상 소방서 수
      responses:
        '200':
          description: 출동 현황 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  as_of:
                    type: string
                    format: date-time
                    description: 데이터 기준 시각
                  stations:
                    type: array
                    items:
                      $ref: '#/components/schemas/EmergencyStationStatus'

  /stations/{station_id}/favorites:
    post:
      summary: 소방서 즐겨찾기 추가
      description: 특정 소방서를 즐겨찾기에 추가
      security:
        - bearerAuth: []
      parameters:
        - name: station_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: 즐겨찾기 추가 성공
        '409':
          description: 이미 즐겨찾기에 추가됨

    delete:
      summary: 소방서 즐겨찾기 제거
      description: 특정 소방서를 즐겨찾기에서 제거
      security:
        - bearerAuth: []
      parameters:
        - name: station_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 즐겨찾기 제거 성공
        '404':
          description: 즐겨찾기에 없음

components:
  schemas:
    FireStation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          description: 소방서명
        address:
          type: string
          description: 주소
        location:
          type: object
          properties:
            lat:
              type: number
              format: float
            lng:
              type: number
              format: float
        phone:
          type: string
        region:
          type: string
          description: 시/도
        district:
          type: string
          description: 구/군
        status:
          type: string
          enum: [active, closed, merged]
        total_received:
          type: number
          format: decimal
          description: 총 수혜 금액
        donor_count:
          type: integer
          description: 기부자 수

    FireStationDetail:
      allOf:
        - $ref: '#/components/schemas/FireStation'
        - type: object
          properties:
            station_code:
              type: string
              description: 소방청 코드
            last_incident_at:
              type: string
              format: date-time
            recent_donations:
              type: array
              items:
                type: object
                properties:
                  amount:
                    type: number
                    format: decimal
                  donor_name:
                    type: string
                  message:
                    type: string
                  created_at:
                    type: string
                    format: date-time
            is_favorite:
              type: boolean
              description: 현재 사용자의 즐겨찾기 여부

    EmergencyStationStatus:
      type: object
      properties:
        station:
          $ref: '#/components/schemas/FireStation'
        status:
          type: string
          enum: [dispatching, suppressing, standby, maintenance]
          description: 현장 대응 상태 코드
        status_label:
          type: string
          description: 사용자 표시용 상태 문구 (예: "출동 중")
        priority:
          type: string
          enum: [high, medium, low]
          description: 긴급도 수준
        updated_at:
          type: string
          format: date-time
          description: 최신 상태 갱신 시각
        summary:
          type: string
          description: 현장 요약 메시지
        active_incidents:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              title:
                type: string
              started_at:
                type: string
                format: date-time
          description: 연관 사고 목록 (선택)

    Ranking:
      type: object
      properties:
        rank:
          type: integer
        user:
          type: object
          properties:
            name:
              type: string
            tier:
              type: integer
        total_amount:
          type: number
          format: decimal
        donation_count:
          type: integer

    NewsContent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        summary:
          type: string
        source:
          type: string
        source_url:
          type: string
        published_at:
          type: string
          format: date-time
        relevance_score:
          type: integer
          minimum: 1
          maximum: 100
        keywords:
          type: array
          items:
            type: string

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
