openapi: 3.0.3
info:
  title: 보담 인증 API
  description: 사용자 인증 및 계정 관리 API
  version: 1.0.0

servers:
  - url: https://api.bodam.example
    description: 프로덕션 서버

paths:
  /auth/signup:
    post:
      summary: 회원가입
      description: 새 사용자 계정 생성
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - name
              properties:
                email:
                  type: string
                  format: email
                  description: 사용자 이메일
                password:
                  type: string
                  minLength: 8
                  description: 비밀번호 (최소 8자)
                name:
                  type: string
                  minLength: 2
                  description: 사용자 이름
                phone:
                  type: string
                  pattern: '^01[0-9]{8,9}$'
                  description: 휴대폰 번호 (선택)
      responses:
        '201':
          description: 계정 생성 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id:
                    type: string
                    format: uuid
                  email:
                    type: string
                  message:
                    type: string
                    example: "인증 이메일이 발송되었습니다"
        '400':
          description: 잘못된 요청 데이터
        '409':
          description: 이미 존재하는 이메일

  /auth/login:
    post:
      summary: 로그인
      description: 이메일과 비밀번호로 로그인
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: 로그인 성공
          headers:
            Set-Cookie:
              description: HttpOnly 쿠키에 JWT 토큰 설정
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
                  access_token:
                    type: string
                    description: JWT 액세스 토큰
        '401':
          description: 인증 실패
        '403':
          description: 계정 비활성화

  /auth/logout:
    post:
      summary: 로그아웃
      description: 현재 세션 종료
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 로그아웃 성공
          headers:
            Set-Cookie:
              description: 쿠키 삭제
              schema:
                type: string

  /auth/refresh:
    post:
      summary: 토큰 갱신
      description: Refresh 토큰으로 새 Access 토큰 발급
      responses:
        '200':
          description: 토큰 갱신 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
        '401':
          description: 유효하지 않은 refresh 토큰

  /auth/social/{provider}:
    get:
      summary: 소셜 로그인
      description: 소셜 제공자를 통한 OAuth 로그인
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [google, kakao, naver]
      responses:
        '302':
          description: OAuth 제공자로 리다이렉트

  /auth/social/{provider}/callback:
    get:
      summary: 소셜 로그인 콜백
      description: OAuth 제공자에서 돌아오는 콜백 처리
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [google, kakao, naver]
        - name: code
          in: query
          required: true
          schema:
            type: string
            description: OAuth 인증 코드
      responses:
        '302':
          description: 프론트엔드로 리다이렉트
        '400':
          description: OAuth 인증 실패

components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        phone:
          type: string
        role:
          type: string
          enum: [donor, admin, moderator]
        tier:
          type: integer
          minimum: 1
          maximum: 8
          description: 기부자 등급
        total_donated:
          type: number
          format: decimal
          description: 총 기부 금액
        created_at:
          type: string
          format: date-time

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT