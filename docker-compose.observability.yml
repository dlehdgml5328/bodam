version: '3.9'

# 관측성 스택 (Observability Stack)
# Prometheus, Loki, Tempo, OpenTelemetry Collector, statsd-exporter
services:
  # ============================================
  # Prometheus - 메트릭 수집 및 저장
  # ============================================
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: bodam-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./specs/004-hybrid-observability-stack/contracts/prometheus-config.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=3d'
      - '--storage.tsdb.retention.size=10GB'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - bodam-network
    restart: unless-stopped

  # ============================================
  # Loki - 로그 수집 및 저장
  # ============================================
  loki:
    image: grafana/loki:2.9.3
    container_name: bodam-loki
    ports:
      - "3100:3100"
    volumes:
      - ./specs/004-hybrid-observability-stack/contracts/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - bodam-network
    restart: unless-stopped

  # ============================================
  # Tempo - 분산 트레이싱 수집 및 저장
  # ============================================
  tempo:
    image: grafana/tempo:2.3.1
    container_name: bodam-tempo
    ports:
      - "3200:3200"  # Tempo HTTP API
      - "4317:4317"  # OTLP gRPC
      - "4318:4318"  # OTLP HTTP
      - "14268:14268"  # Jaeger HTTP
    volumes:
      - ./specs/004-hybrid-observability-stack/contracts/tempo-config.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/tempo
    command: -config.file=/etc/tempo/tempo.yaml
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3200/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - bodam-network
    restart: unless-stopped

  # ============================================
  # OpenTelemetry Collector - 트레이스 수집기
  # ============================================
  otel-collector:
    image: otel/opentelemetry-collector:0.91.0
    container_name: bodam-otel-collector
    ports:
      - "4317:4317"  # OTLP gRPC (primary)
      - "4318:4318"  # OTLP HTTP
      - "8888:8888"  # Metrics endpoint
    volumes:
      - ./specs/004-hybrid-observability-stack/contracts/tempo-config.yaml:/etc/otel/config.yaml:ro
    command: ["--config=/etc/otel/config.yaml"]
    depends_on:
      tempo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:13133/"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - bodam-network
    restart: unless-stopped

  # ============================================
  # Promtail - 로그 수집 에이전트 (Loki로 전송)
  # ============================================
  promtail:
    image: grafana/promtail:2.9.3
    container_name: bodam-promtail
    volumes:
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./specs/004-hybrid-observability-stack/contracts/loki-config.yaml:/etc/promtail/config.yaml:ro
    command: -config.file=/etc/promtail/config.yaml
    depends_on:
      loki:
        condition: service_healthy
    networks:
      - bodam-network
    restart: unless-stopped

  # ============================================
  # statsd-exporter - K6 메트릭을 Prometheus 포맷으로 변환
  # ============================================
  statsd-exporter:
    image: prom/statsd-exporter:v0.26.0
    container_name: bodam-statsd-exporter
    ports:
      - "9102:9102"  # Prometheus metrics endpoint
      - "8125:8125/udp"  # statsd UDP port
    command:
      - '--statsd.mapping-config=/etc/statsd/statsd-mapping.yml'
    volumes:
      - ./infra/k8s/observability/statsd-mapping.yml:/etc/statsd/statsd-mapping.yml:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9102/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - bodam-network
    restart: unless-stopped

  # ============================================
  # Grafana (Optional) - 시각화 (개발 환경에서만 사용)
  # ============================================
  grafana:
    image: grafana/grafana:10.2.3
    container_name: bodam-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - SLACK_BODAM_ALERT_WEBHOOK=${SLACK_BODAM_ALERT_WEBHOOK}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/k8s/observability/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./infra/k8s/observability/grafana-alerting.yml:/etc/grafana/provisioning/alerting/contact-points.yml:ro
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - bodam-network
    restart: unless-stopped

# ============================================
# Networks & Volumes
# ============================================
networks:
  bodam-network:
    name: bodam_bodam-network
    external: true

volumes:
  prometheus-data:
    driver: local
  loki-data:
    driver: local
  tempo-data:
    driver: local
  grafana-data:
    driver: local
