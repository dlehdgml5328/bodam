name: Backend CI/CD

# wonuk, donghee 브랜치 push 시 트리거
on:
  push:
    branches:
      - wonuk
      - donghee
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci-cd.yml'

env:
  REGISTRY: registry.digitalocean.com/bodam
  IMAGE_NAME: backend
  PYTHON_VERSION: '3.11'

jobs:
  test:
    name: 테스트 실행
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: bodam_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: 의존성 설치
        working-directory: ./backend
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio ruff mypy

      - name: Ruff 코드 검사
        working-directory: ./backend
        run: ruff check .

      - name: MyPy 타입 검사
        working-directory: ./backend
        run: mypy src --ignore-missing-imports

      - name: 단위 테스트 실행
        continue-on-error: true
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/bodam_test
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET_KEY: test-secret-key-for-ci
          ENVIRONMENT: test
        run: |
          pytest tests/unit/ -v --cov=src --cov-report=xml --cov-report=term

      - name: 통합 테스트 실행
        continue-on-error: true
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/bodam_test
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET_KEY: test-secret-key-for-ci
          ENVIRONMENT: test
        run: |
          pytest tests/integration/ -v --cov=src --cov-append --cov-report=xml

      - name: 성능 테스트 실행
        continue-on-error: true
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/bodam_test
          REDIS_URL: redis://localhost:6379/0
          ENVIRONMENT: test
        run: |
          pytest tests/performance/ -v

      - name: 테스트 커버리지 업로드
        uses: codecov/codecov-action@v4
        with:
          files: ./backend/coverage.xml
          flags: backend
          name: backend-coverage

  build-and-push:
    name: Docker 이미지 빌드 및 푸시
    needs: test
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: Docker 메타데이터 생성
        id: meta
        run: |
          if [ "${{ github.ref }}" == "refs/heads/donghee" ]; then
            echo "tags=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:production-${{ github.sha }}" >> $GITHUB_OUTPUT
            echo "environment=production" >> $GITHUB_OUTPUT
          else
            echo "tags=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:preview-${{ github.sha }}" >> $GITHUB_OUTPUT
            echo "environment=preview" >> $GITHUB_OUTPUT
          fi

      - name: DigitalOcean Container Registry 로그인
        uses: docker/login-action@v3
        with:
          registry: registry.digitalocean.com
          username: ${{ secrets.DIGITALOCEAN_TOKEN }}
          password: ${{ secrets.DIGITALOCEAN_TOKEN }}

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@v3

      - name: Docker 이미지 빌드 및 푸시
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max
          build-args: |
            PYTHON_VERSION=${{ env.PYTHON_VERSION }}

  deploy:
    name: Kubernetes 배포
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: 환경 변수 설정
        id: env
        run: |
          if [ "${{ github.ref }}" == "refs/heads/donghee" ]; then
            echo "environment=production" >> $GITHUB_OUTPUT
            echo "namespace=bodam-prod" >> $GITHUB_OUTPUT
            echo "cluster_id=${{ secrets.DIGITALOCEAN_CLUSTER_ID_PROD }}" >> $GITHUB_OUTPUT
          else
            echo "environment=preview" >> $GITHUB_OUTPUT
            echo "namespace=bodam-preview" >> $GITHUB_OUTPUT
            echo "cluster_id=${{ secrets.DIGITALOCEAN_CLUSTER_ID_PREVIEW }}" >> $GITHUB_OUTPUT
          fi

      - name: DigitalOcean CLI 설치
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_TOKEN }}

      - name: Kubernetes 인증 설정
        run: |
          doctl kubernetes cluster kubeconfig save ${{ steps.env.outputs.cluster_id }}

      - name: 네임스페이스 생성 (존재하지 않는 경우)
        run: |
          kubectl create namespace ${{ steps.env.outputs.namespace }} --dry-run=client -o yaml | kubectl apply -f -

      - name: Docker Registry Secret 생성
        run: |
          kubectl create secret docker-registry regcred \
            --docker-server=registry.digitalocean.com \
            --docker-username=${{ secrets.DIGITALOCEAN_TOKEN }} \
            --docker-password=${{ secrets.DIGITALOCEAN_TOKEN }} \
            --namespace=${{ steps.env.outputs.namespace }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: 애플리케이션 Secrets 생성
        run: |
          # Secret이 존재하면 삭제 후 재생성
          kubectl delete secret bodam-secrets --namespace=${{ steps.env.outputs.namespace }} --ignore-not-found=true || true
          sleep 2
          kubectl create secret generic bodam-secrets --from-literal=database-url="${{ secrets.DATABASE_URL }}" --from-literal=jwt-secret="${{ secrets.JWT_SECRET_KEY }}" --from-literal=together-api-key="${{ secrets.TOGETHER_AI_API_KEY }}" --from-literal=admin-secret-key="${{ secrets.ADMIN_SECRET_KEY }}" --namespace=${{ steps.env.outputs.namespace }}

      - name: 이미지 태그 업데이트
        run: |
          # Backend deployment v2 (Redis 3개 분리 구조)
          sed -i "s|image: registry.digitalocean.com/bodam/backend:latest|image: ${{ needs.build-and-push.outputs.image_tag }}|g" infra/k8s/backend/backend-deployment-v2.yaml
          # Celery deployments
          sed -i "s|image: registry.digitalocean.com/bodam/backend:latest|image: ${{ needs.build-and-push.outputs.image_tag }}|g" infra/k8s/celery/*.yaml

      - name: Redis 배포 (3개 분리)
        run: |
          echo "📦 Redis 3개 배포..."
          kubectl apply -f infra/k8s/redis/redis-cache-deployment.yaml -n ${{ steps.env.outputs.namespace }}
          kubectl apply -f infra/k8s/redis/redis-queue-deployment.yaml -n ${{ steps.env.outputs.namespace }}
          kubectl apply -f infra/k8s/redis/redis-semantic-deployment.yaml -n ${{ steps.env.outputs.namespace }}

      - name: Backend 배포
        run: |
          echo "🚀 Backend 배포..."
          kubectl apply -f infra/k8s/backend/configmap.yaml -n ${{ steps.env.outputs.namespace }} || echo "ConfigMap 없음"
          kubectl apply -f infra/k8s/backend/backend-deployment-v2.yaml -n ${{ steps.env.outputs.namespace }}

      - name: Celery Workers 배포 (3개 분리)
        run: |
          echo "⚙️ Celery Workers 배포..."
          kubectl apply -f infra/k8s/celery/celery-worker-deployment.yaml -n ${{ steps.env.outputs.namespace }}
          kubectl apply -f infra/k8s/celery/celery-worker-news-deployment.yaml -n ${{ steps.env.outputs.namespace }}
          kubectl apply -f infra/k8s/celery/celery-beat-deployment.yaml -n ${{ steps.env.outputs.namespace }}

      - name: HPA 배포
        run: |
          echo "📈 HPA 배포..."
          kubectl apply -f infra/k8s/backend/hpa.yaml -n ${{ steps.env.outputs.namespace }} || echo "HPA 없음"
          kubectl apply -f infra/k8s/backend/celery-worker-hpa.yaml -n ${{ steps.env.outputs.namespace }} || echo "Celery HPA 없음"

      - name: 배포 상태 확인
        run: |
          echo "✅ Backend 배포 상태..."
          kubectl rollout status deployment/bodam-backend -n ${{ steps.env.outputs.namespace }} --timeout=5m

          echo "✅ Celery Worker 배포 상태..."
          kubectl rollout status deployment/celery-worker -n ${{ steps.env.outputs.namespace }} --timeout=5m || echo "Celery worker rollout check failed"

          echo "✅ Celery News Worker 배포 상태..."
          kubectl rollout status deployment/celery-worker-news -n ${{ steps.env.outputs.namespace }} --timeout=5m || echo "Celery news worker rollout check failed"

      - name: Pod 상태 확인
        if: always()
        run: |
          echo "📋 전체 Pod 상태..."
          kubectl get pods -n ${{ steps.env.outputs.namespace }}

          echo ""
          echo "📋 Backend Pods..."
          kubectl get pods -n ${{ steps.env.outputs.namespace }} -l app=bodam-backend

          echo ""
          echo "📋 Celery Worker Pods..."
          kubectl get pods -n ${{ steps.env.outputs.namespace }} -l component=worker

          echo ""
          echo "📋 Redis Pods..."
          kubectl get pods -n ${{ steps.env.outputs.namespace }} -l component=cache
          kubectl get pods -n ${{ steps.env.outputs.namespace }} -l component=queue
          kubectl get pods -n ${{ steps.env.outputs.namespace }} -l component=semantic

  smoke-test:
    name: 스모크 테스트
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - name: 환경 변수 설정
        id: env
        run: |
          # Production만 지원 (donghee 브랜치)
          if [ "${{ github.ref }}" == "refs/heads/donghee" ]; then
            echo "api_url=https://api.bodam.website" >> $GITHUB_OUTPUT
          else
            # Preview는 아직 미구성
            echo "api_url=https://api.bodam.website" >> $GITHUB_OUTPUT
          fi

      - name: Health Check 확인
        run: |
          for i in {1..30}; do
            if curl -f -s ${{ steps.env.outputs.api_url }}/health; then
              echo "✅ Health check passed"
              exit 0
            fi
            echo "⏳ Waiting for health check... ($i/30)"
            sleep 10
          done
          echo "❌ Health check failed"
          exit 1

      - name: API 응답 테스트
        run: |
          # 기본 API 엔드포인트 테스트
          response=$(curl -s -o /dev/null -w "%{http_code}" ${{ steps.env.outputs.api_url }}/api/v1/health)
          if [ "$response" -eq 200 ]; then
            echo "✅ API responded with 200"
          else
            echo "❌ API responded with $response"
            exit 1
          fi

      - name: 배포 알림 (Slack)
        if: always()
        uses: slackapi/slack-github-action@v1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "Backend 배포 ${{ job.status }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Backend CI/CD*\n환경: ${{ needs.deploy.outputs.environment }}\n상태: ${{ job.status }}\n브랜치: ${{ github.ref_name }}\n커밋: ${{ github.sha }}"
                  }
                }
              ]
            }
