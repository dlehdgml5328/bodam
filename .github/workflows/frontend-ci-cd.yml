name: Frontend CI/CD

# develop, wonuk, donghee 브랜치 push 시 트리거
on:
  push:
    branches:
      - develop
      - wonuk
      - donghee
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci-cd.yml'

env:
  NODE_VERSION: '18'

jobs:
  lint-and-test:
    name: 린트 및 테스트
    runs-on: ubuntu-latest

    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 의존성 설치
        working-directory: ./frontend
        run: npm ci

      - name: ESLint 검사
        working-directory: ./frontend
        run: npm run lint

      - name: TypeScript 타입 검사
        working-directory: ./frontend
        run: npm run type-check

      - name: Jest 단위 테스트
        working-directory: ./frontend
        run: npm run test:unit -- --coverage --maxWorkers=2
        env:
          NODE_ENV: test

      - name: 테스트 커버리지 업로드
        uses: codecov/codecov-action@v4
        continue-on-error: true
        with:
          files: ./frontend/coverage/coverage-final.json
          flags: frontend
          name: frontend-coverage

  build:
    name: 프로덕션 빌드 테스트
    needs: lint-and-test
    runs-on: ubuntu-latest

    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 의존성 설치
        working-directory: ./frontend
        run: npm ci

      - name: 프로덕션 빌드
        working-directory: ./frontend
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_API_URL: http://129.212.208.32

      - name: 빌드 아티팩트 검증
        working-directory: ./frontend
        run: |
          if [ ! -d ".next" ]; then
            echo "❌ .next directory not found"
            exit 1
          fi
          echo "✅ Build artifacts verified"
          echo "🚀 Vercel will auto-deploy via Git integration"
