name: 🔍 Show Secrets (임시 - 확인 후 삭제)

on:
  workflow_dispatch:  # 수동 실행만 가능

jobs:
  show-info:
    runs-on: ubuntu-latest
    steps:
      - name: 📋 Show Configuration
        run: |
          echo "========================================="
          echo "🌐 API URLs"
          echo "========================================="
          echo "PRODUCTION_API_URL: ${{ secrets.PRODUCTION_API_URL }}"
          echo "PREVIEW_API_URL: ${{ secrets.PREVIEW_API_URL }}"
          echo ""
          echo "========================================="
          echo "☸️ Kubernetes Cluster IDs"
          echo "========================================="
          echo "DIGITALOCEAN_CLUSTER_ID_PROD: ${{ secrets.DIGITALOCEAN_CLUSTER_ID_PROD }}"
          echo "DIGITALOCEAN_CLUSTER_ID_PREVIEW: ${{ secrets.DIGITALOCEAN_CLUSTER_ID_PREVIEW }}"
          echo ""
          echo "========================================="
          echo "🔐 Other Secrets (existence check)"
          echo "========================================="
          echo "DATABASE_URL: ${{ secrets.DATABASE_URL != '' && '✅ Set' || '❌ Not Set' }}"
          echo "JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY != '' && '✅ Set' || '❌ Not Set' }}"
          echo "TOGETHER_AI_API_KEY: ${{ secrets.TOGETHER_AI_API_KEY != '' && '✅ Set' || '❌ Not Set' }}"
          echo "DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN != '' && '✅ Set' || '❌ Not Set' }}"
          echo "VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN != '' && '✅ Set' || '❌ Not Set' }}"
          echo "NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID != '' && '✅ Set' || '❌ Not Set' }}"
          echo "YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY != '' && '✅ Set' || '❌ Not Set' }}"
          echo "TOSS_CLIENT_KEY: ${{ secrets.TOSS_CLIENT_KEY != '' && '✅ Set' || '❌ Not Set' }}"
          echo "SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL != '' && '✅ Set' || '❌ Not Set' }}"
          echo ""
          echo "========================================="
          echo "✅ 완료!"
          echo "이 워크플로우는 확인 후 삭제하세요."
          echo "========================================="
