name: Update Vercel Environment Variables

on:
  workflow_dispatch:

jobs:
  update-env:
    runs-on: ubuntu-latest
    steps:
      - name: Update Vercel Environment Variables
        run: |
          # API Base URL 설정
          curl -X POST "https://api.vercel.com/v10/projects/${{ secrets.VERCEL_PROJECT_ID }}/env" \
            -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "key": "NEXT_PUBLIC_API_BASE_URL",
              "value": "https://api.bodam.website",
              "type": "encrypted",
              "target": ["production", "preview"]
            }'

          echo "✅ 환경변수 업데이트 완료!"

      - name: Checkout code
        uses: actions/checkout@v3

      - name: Trigger Vercel Redeploy via Git
        run: |
          # Git commit으로 Vercel 자동 재배포 트리거
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

          # 빈 커밋으로 재배포 트리거
          git commit --allow-empty -m "chore: trigger Vercel redeploy with updated env vars"
          git push origin donghee

          echo "✅ 재배포 트리거 완료!"
